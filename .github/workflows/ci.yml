name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26"
  SOLANA_VERSION: "2.3.11"
  SOLANA_SHA256: "3127d066a6b9e3e5e5558a2d34112434a60d0410800d94e6bb12714315dc5f26"
  ANCHOR_VERSION: "1.2.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  check:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: make install

      # The Rust version, with rustfmt and clippy, comes from rust-toolchain.toml.
      - name: Format, lint and type checks
        run: make check

  engine:
    name: Engine rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the engine's tests
        run: cargo test --locked -p noirwire-orderbook-engine

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo-audit
        id: cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

      - name: Check the Rust dependencies against known advisories
        run: make audit

  test:
    name: Build and test on a local network
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: make install

      # The version the tests are developed against, taken as the release
      # archive itself and checked against its published SHA-256, not through
      # an installer script. Everything below runs against a throwaway local
      # network; nothing here reaches devnet or mainnet.
      - name: Install Solana CLI
        working-directory: ${{ runner.temp }}
        run: |
          archive=solana-release-x86_64-unknown-linux-gnu.tar.bz2
          curl -sSfLO "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/${archive}"
          echo "${SOLANA_SHA256}  ${archive}" | sha256sum --check
          tar -xjf "${archive}"
          echo "${PWD}/solana-release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor CLI
        id: anchor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        if: steps.anchor.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          cargo install anchor-cli --locked --version "$ANCHOR_VERSION"

      - name: Build
        run: make build

      # The rollup validator opens many files and watchers at once.
      - name: Test
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1280
          sudo sysctl -w fs.inotify.max_user_watches=655360
          sudo sysctl -w fs.file-max=2097152
          sudo prlimit --pid $$ --nofile=1000000:1000000
          make test

      - name: Pack the client
        run: make sdk

      - name: Show the local network's log
        if: failure()
        run: cat .localnet/stack.log
