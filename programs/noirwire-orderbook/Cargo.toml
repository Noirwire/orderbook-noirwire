[package]
name = "noirwire-orderbook"
version = "0.1.0"
description = "A private order book for spot and perpetual markets on a private rollup"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "noirwire_orderbook"

[features]
# Every build leaves out Anchor's `Instruction: <name>` log line, which adds
# about 4 KB to the program and so to its rent. Errors are still logged.
default = ["no-log-ix-name"]
# A test network's build: adds `publish_price` and `reset_price`, signed by the
# exchange's oracle key, for markets bound to no price source. The default
# build, the one mainnet deploys, has neither (`make check-mainnet`).
test-oracle = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.1"
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor", "access-control"] }
magicblock-magic-program-api = "=0.10.1"
solana-security-txt = "=1.1.3"
solana-sha256-hasher = "=2.3.0"
# These match Anchor's Solana 3 account and public-key types for proof introspection.
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"
bytemuck = { version = "=1.25.2", default-features = false, features = ["derive", "min_const_generics"] }
noirwire-orderbook-engine = { path = "../../crates/engine" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
